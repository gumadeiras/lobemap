# Assets are geometry or images, atlas and reference alike, distinguished by
# `role`. Paths are relative to the registry root.
# Populated by `lobemap ingest`; entries below are added as data lands.
#
# Every asset records its data license in `source.license` and the page that
# states it in `source.license_url`, each checked against the primary source
# (the dataset page, the data portal or the paper). The code's MIT license
# does not cover any of them; README.md has the summary.

[neuprint_hemibrain_glomeruli]
role = "glomeruli"
space = "JRCFIB2018F"
kind = "meshset"
side = "both"
path = "data/neuprint_hemibrain_glomeruli.npz"
[neuprint_hemibrain_glomeruli.source]
url = "https://neuprint.janelia.org"
doi = "10.7554/eLife.57443"
license = "CC BY 4.0"
license_url = "https://www.janelia.org/project-team/flyem/hemibrain"

[neuprint_hemibrain_neuropil]
