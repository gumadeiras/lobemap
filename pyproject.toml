[project]
name = "lobemap"
version = "0.2.0"
description = "napari viewer for Drosophila antennal lobe glomerular atlases across coordinate spaces"
readme = "README.md"
# MIT, and the copyright in LICENSE is Gustavo Madeira Santana's. Both
# lines came from the original pyproject and were lost in the rewrite,
# which shipped a package declaring no license at all.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
# Gustavo Madeira Santana originated lobemap and holds the copyright in
# LICENSE. The viewer here is a rewrite, but the project, its name, the
# curated nomenclature tables and the source data under registry/sources/
# are his work, so he stays on the package metadata -- see README Authors.
authors = [
  { name = "David Zimmerman" },
  { name = "Gustavo Madeira Santana", email = "fromweb1@gumadeiras.com" },
]
keywords = ["drosophila", "napari", "neuroanatomy", "visualization"]
# The original's list, plus the two the rewrite earns: it reads and
# writes image formats, and it is a napari plugin-adjacent viewer. No
# license classifier -- PEP 639 forbids one alongside `license`, and
# setuptools refuses the build outright.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization",
  "Framework :: napari",
]

# Runtime only. The data-access stack (navis, flybrains,
# fafbseg, neuprint-python) is deliberately NOT here: the viewer must open a
# scene from the canonical mesh format and the registry alone, with no network
# access, no neuPrint token, and no CMTK.
dependencies = [
  "napari[pyqt6,bermuda]>=0.9.2,<0.10",  # pinned for its internals; see tests/test_napari_private.py
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "trimesh>=4.4",       # mesh I/O plus mesh-plane intersection for slice contours
  "qtpy>=2.4",
  "platformdirs>=4.2",  # cache location for bridged/derived geometry
  "tifffile>=2024.8",   # Grabe LM stack
  "pynrrd>=1.0",        # NRRD image stacks (ingest.image_stack)
  "zarr>=3",            # OME-Zarr volumes: chunked, compressed and multiscale
  "numcodecs>=0.12",    # blosc/zstd codec for the above
  "dask>=2024.1",       # lazy slicing: napari materialises an eager array whole
  "rtree>=1.3",         # trimesh ray engine, for exact point-in-mesh containment
  "pymeshfix>=0.17",    # MeshFix: watertight repair where fill_holes cannot cope
  "py7zr>=0.21",        # Grabe 2015 ships its glomerulus OBJs in a .7z archive
]

[project.urls]
Homepage = "https://github.com/gumadeiras/lobemap"
Source = "https://github.com/gumadeiras/lobemap"
Changelog = "https://github.com/gumadeiras/lobemap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ingest, bridging and rebuild time only; the viewer never needs them.
# Published as an extra so an installed lobemap can get them too:
# `pip install "lobemap[ingest]"`.
ingest = [
  "navis>=1.12",          # transform engine: xform_brain, mirror_brain
  "flybrains>=0.6",      # navis-flybrains: templates and bridging registrations
  "fafbseg>=3.2",        # FAFB/FlyWire meshes and synapse tables
  "neuprint-python>=0.6.3",# hemibrain / male CNS ROIs, meshes, synapses
  "pyvista>=0.49",       # Benton 2025 3D Slicer .vtm / .vtp
  "h5py>=3.11",          # H5 deformation fields
  "requests>=2.32",
  "pytz>=2024.1",        # undeclared fafbseg import; pandas 3.0 no longer supplies it
  "scikit-image>=0.24",  # marching cubes for the Grabe label volume
  "pyarrow>=16",         # the FAFB and male CNS bulk synapse tables
  "cloud-volume>=12",    # the hemibrain synapse shards
]

[dependency-groups]
# A checkout's `uv sync` installs both groups (`default-groups` below), so
# the tests and every `build` recipe work there. `uv sync --no-group
# ingest` leaves the ingest extra out.
ingest = ["lobemap[ingest]"]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "setuptools>=77",      # tests/test_wheel.py builds the wheel in-process
]

# The registry metadata ships inside the package as `lobemap/registry`, so an
# installed lobemap finds its spaces, assets, atlases and nomenclature
# without a checkout. It stays at `registry/` in the source tree, beside
# `registry/data` and `registry/sources`, which are gigabytes and never
# ship: the globs below name the metadata files and nothing under those
# two directories. Mapping a directory outside `src/` needs an explicit
# package list; a subpackage missing from it would not ship, and
# `tests/test_wheel.py` fails if one is.
[tool.setuptools]
packages = [
  "lobemap",
  "lobemap.core",
  "lobemap.ingest",
  "lobemap.registry",
  "lobemap.validate",
  "lobemap.viewer",
]

[tool.setuptools.package-dir]
"" = "src"
"lobemap.registry" = "registry"

[tool.setuptools.package-data]
"lobemap.registry" = ["*.toml", "*.csv", "atlases/*.toml", "reference/*.csv"]

[project.scripts]
lobemap = "lobemap.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No deprecated API: any deprecation is an error. napari attributes its
# own attribute deprecations to the wrong frame, so a filter on lobemap's
# module names would miss them; hence the blanket rule. The exceptions are
# dependencies whose own internals warn and that no permitted upgrade fixes:
# scikit-image 0.26 sets an array's shape, which NumPy 2.5 deprecated, and
# napari's pydantic models use `json_encoders`. Add one only for a warning
# raised inside a dependency.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error::FutureWarning",
  "default:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:skimage",
  "default::DeprecationWarning:pydantic",
]
