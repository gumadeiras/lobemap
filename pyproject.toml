[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lobemap"
version = "0.1.4"
description = "napari viewer for Drosophila antennal lobe atlases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gustavo Madeira Santana", email = "fromweb1@gumadeiras.com" },
]
requires-python = ">=3.11,<3.13"
keywords = ["drosophila", "napari", "neuroanatomy", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.9",
  "napari[pyqt6]>=0.6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "qtpy>=2.4",
  "tifffile>=2024.8.30",
]

[project.scripts]
lobemap = "lobemap.lobemap:main"

[project.urls]
Homepage = "https://github.com/gumadeiras/lobemap"
Repository = "https://github.com/gumadeiras/lobemap"
Issues = "https://github.com/gumadeiras/lobemap/issues"

[tool.setuptools]
package-dir = { lobemap = "." }
packages = ["lobemap"]
include-package-data = false

[tool.setuptools.package-data]
lobemap = [
  "lobemap",
  "datasets/paper_pdf_sources.csv",
  "scripts/*.py",
  "docs/*.md",
  "datasets/*/README.md",
  "datasets/*/NOTES.md",
  "datasets/*/*.py",
  "datasets/*/scripts/*.py",
  "datasets/reference-tables/*.csv",
  "datasets/reference-tables/scripts/*.py",
  "datasets/*/data/derived/**/*",
  "datasets/*/data/validation/**/*",
  "datasets/banc/data/source/**/*",
  "datasets/door/data/source/**/*",
  "datasets/edmond-fibsem/data/source/**/*",
  "datasets/flywire-codex/data/source/**/*",
  "datasets/flywire/data/source/**/*",
  "datasets/grabe-2015/data/source/*.am",
  "datasets/grabe-2015/data/source/*.csv",
  "datasets/grabe-2015/data/source/*.png",
  "datasets/grabe-2015/data/source/*.tif",
  "datasets/hemibrain/data/source/**/*",
  "datasets/jrc2018unisex/data/source/**/*",
  "datasets/vfb/data/source/**/*",
]

[tool.setuptools.exclude-package-data]
lobemap = [
  "**/.DS_Store",
  "**/__pycache__/*",
  "**/*.py[cod]",
]
